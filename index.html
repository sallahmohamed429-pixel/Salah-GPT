<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SalahPT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7c86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SalahPT">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#14232b;--bench:#eef2f1;--panel:#fff;--line:#d3dcda;--accent:#0e7c86;--accent-ink:#fff;--user:#dcefee;--muted:#5d6e72;--code:#14232b;--code-ink:#e6f2f1}
@media (prefers-color-scheme:dark){:root{--ink:#e6f0ef;--bench:#0f1a1f;--panel:#16252b;--line:#27393f;--accent:#33b3bd;--accent-ink:#06191c;--user:#18343a;--muted:#93a8ac;--code:#0a1317;--code-ink:#d5e8e6;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bench);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;font-size:16px;line-height:1.6;display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:18px;line-height:1}
.ic:hover{background:var(--user);color:var(--ink)}
#feed{flex:1;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
#feed>*{width:100%;max-width:760px;margin-inline:auto}
.empty h2{font-size:26px;margin:7vh 0 6px}
.muted{color:var(--muted);font-size:14px;margin:0}
.starters{display:grid;gap:10px;margin-top:16px}
.starters button{text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msg{display:flex;gap:6px;align-items:flex-start}
.msg.user .body{background:var(--user);border-radius:14px;padding:10px 14px;margin-inline-start:auto;max-width:88%}
.msg.assistant .body{flex:1;min-width:0}
.body p{margin:0 0 .7em}.body p:last-child{margin:0}
pre{background:var(--code);color:var(--code-ink);border-radius:10px;padding:12px 14px;overflow:auto;font-size:13.5px;line-height:1.5;margin:0 0 .8em;text-align:left;direction:ltr}
.strip{display:flex;gap:3px;padding:8px 0}
.strip i{width:14px;height:10px;border-radius:2px;opacity:.25;animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25;transform:scaleY(.8)}50%{opacity:1;transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){.strip i{animation:none;opacity:.8}}
.err{color:#c0392b;font-size:14px;margin:0}
form{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));max-width:788px;width:100%;margin-inline:auto}
textarea{flex:1;resize:none;max-height:150px;min-height:46px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit}
.send{width:48px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:20px}
.send:disabled{opacity:.45}
#drawer{position:fixed;inset:0;z-index:20;display:none}
#drawer.open{display:flex}
#drawer .scrim{flex:1;background:rgba(0,0,0,.45)}
#drawer aside{width:min(300px,85vw);background:var(--panel);display:flex;flex-direction:column;padding:14px;gap:10px;padding-top:calc(14px + env(safe-area-inset-top))}
.new{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px;font-weight:600}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;border-radius:8px}
.item.on{background:var(--user)}
.item .t{flex:1;text-align:start;background:none;border:0;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);width:min(420px,92vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-size:14px;margin:12px 0 4px}
dialog select,dialog input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bench);color:var(--ink);font:inherit;direction:ltr}
dialog select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bench);color:var(--ink);font:inherit}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
dialog .row button{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 14px}
dialog .row .ok{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<header>
  <button class="ic" id="menu" aria-label="المحادثات">☰</button>
  <h1 id="title">SalahPT</h1>
  <button class="ic" id="settings" aria-label="الإعدادات">⚙</button>
</header>
<main id="feed" aria-live="polite"></main>
<form id="form">
  <textarea id="input" dir="auto" rows="1" placeholder="اكتب رسالتك"></textarea>
  <button class="send" id="send" aria-label="إرسال" disabled>➤</button>
</form>

<div id="drawer">
  <aside>
    <button class="new" id="new">محادثة جديدة</button>
    <nav id="list" aria-label="المحادثات"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
</div>

<dialog id="dlg">
  <strong>الإعدادات</strong>
  <label for="provider">المزوّد</label>
  <select id="provider">
    <option value="gemini">Google Gemini (فيه باقة مجانية)</option>
    <option value="anthropic">Anthropic Claude (مدفوع)</option>
  </select>
  <label for="key" id="keylabel">مفتاح API</label>
  <input id="key" type="password" autocomplete="off" placeholder="">
  <p class="muted" id="keyhelp"></p>
  <label for="model">الموديل</label>
  <input id="model" type="text">
  <div class="row"><button id="cancel" type="button">إلغاء</button><button id="save" type="button" class="ok">حفظ</button></div>
</dialog>

<script>
const SYSTEM = "You are SalahPT, a concise, accurate assistant. Reply in the same language and dialect the user writes in (Egyptian Arabic stays Egyptian Arabic). Lead with the answer. Use short structured replies and tables when they help. For chemistry, formulation, analytical QC (HPLC/GC) and coding questions, be precise and state assumptions. If unsure, say so.";
const PH = ["#e8212d","#f0462a","#f5742b","#f9a12d","#f6d22f","#c9d82e","#8cc63f","#4cb25a","#1fa58a","#1a8fb5","#2b6cb8","#4b4bb0","#6b3fa0","#7d3a8c"];
const STARTERS = ["اشرحلي خطوات validation لطريقة HPLC","اكتب سكربت بايثون يحسب recovery و RSD","الفرق بين SC و WDG في المبيدات","راجع معايا ثبات مستحلب EC"];
const $ = (id) => document.getElementById(id);

let S = { chats: [], activeId: null };
try { S = Object.assign(S, JSON.parse(localStorage.getItem("salahpt:data") || "{}")); } catch (e) {}
const DEFAULTS = { gemini: "gemini-3.7-flash", anthropic: "claude-sonnet-5-5" };
const HELP = {
  gemini: "من aistudio.google.com/apikey (مجاني). على الباقة المجانية Google ممكن تستخدم المحتوى لتحسين منتجاتها، فمتبعتش بيانات سرّية.",
  anthropic: "من console.anthropic.com. الاستخدام مدفوع بالاستهلاك."
};
let PROVIDER = localStorage.getItem("salahpt:provider") || "gemini";
const keyOf = (p) => localStorage.getItem("salahpt:key:" + p) || "";
const modelOf = (p) => localStorage.getItem("salahpt:model:" + p) || DEFAULTS[p];
let KEY = keyOf(PROVIDER);
let MODEL = modelOf(PROVIDER);
let loading = false, error = "";

const save = () => { try { localStorage.setItem("salahpt:data", JSON.stringify(S)); } catch (e) {} };
const uid = () => Math.random().toString(36).slice(2, 10);
const active = () => S.chats.find((c) => c.id === S.activeId) || null;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function inline(parent, text) {
  text.split(/(\*\*[^*]+\*\*)/g).forEach((p) => {
    if (p.startsWith("**") && p.endsWith("**") && p.length > 4) parent.appendChild(el("strong", "", p.slice(2, -2)));
    else parent.appendChild(document.createTextNode(p));
  });
}

function rich(container, text) {
  text.split("```").forEach((chunk, i) => {
    if (i % 2 === 1) {
      const pre = el("pre");
      pre.appendChild(el("code", "", chunk.replace(/^[^\n]*\n/, "").trimEnd()));
      container.appendChild(pre);
    } else {
      chunk.split(/\n{2,}/).filter((b) => b.trim()).forEach((block) => {
        const p = el("p");
        p.dir = "auto";
        block.split("\n").forEach((line, k) => { if (k) p.appendChild(el("br")); inline(p, line); });
        container.appendChild(p);
      });
    }
  });
}

function renderFeed() {
  const feed = $("feed");
  feed.textContent = "";
  const c = active();
  $("title").textContent = c ? c.title : "SalahPT";
  if (!c || !c.messages.length) {
    const e = el("div", "empty");
    e.appendChild(el("h2", "", "اسأل SalahPT"));
    e.appendChild(el("p", "muted", "كيمياء، تحاليل، كود، أو أي حاجة. جرّب واحد من دول:"));
    const g = el("div", "starters");
    STARTERS.forEach((s) => { const b = el("button", "", s); b.dir = "auto"; b.onclick = () => send(s); g.appendChild(b); });
    e.appendChild(g);
    feed.appendChild(e);
  } else {
    c.messages.forEach((m) => {
      const a = el("article", "msg " + m.role);
      const body = el("div", "body");
      rich(body, m.content);
      a.appendChild(body);
      if (m.role === "assistant") {
        const cp = el("button", "ic", "⧉");
        cp.setAttribute("aria-label", "نسخ");
        cp.onclick = () => { try { navigator.clipboard.writeText(m.content); cp.textContent = "✓"; setTimeout(() => (cp.textContent = "⧉"), 1200); } catch (e) {} };
        a.appendChild(cp);
      }
      feed.appendChild(a);
    });
  }
  if (loading) {
    const a = el("article", "msg assistant");
    const s = el("div", "strip");
    s.setAttribute("role", "status");
    s.setAttribute("aria-label", "بيفكر");
    PH.forEach((col, i) => { const b = el("i"); b.style.background = col; b.style.animationDelay = i * 70 + "ms"; s.appendChild(b); });
    a.appendChild(s);
    feed.appendChild(a);
  }
  if (error) feed.appendChild(el("p", "err", error));
  feed.scrollTop = feed.scrollHeight;
}

function renderList() {
  const l = $("list");
  l.textContent = "";
  if (!S.chats.length) l.appendChild(el("p", "muted", "مفيش محادثات لسه."));
  S.chats.forEach((c) => {
    const row = el("div", "item" + (c.id === S.activeId ? " on" : ""));
    const t = el("button", "t", c.title);
    t.dir = "auto";
    t.onclick = () => { S.activeId = c.id; save(); closeDrawer(); renderAll(); };
    const d = el("button", "ic", "🗑");
    d.setAttribute("aria-label", "مسح");
    d.onclick = () => { S.chats = S.chats.filter((x) => x.id !== c.id); if (S.activeId === c.id) S.activeId = null; save(); renderAll(); };
    row.appendChild(t); row.appendChild(d);
    l.appendChild(row);
  });
}

const renderAll = () => { renderList(); renderFeed(); };
const closeDrawer = () => $("drawer").classList.remove("open");

async function send(raw) {
  const text = (raw !== undefined ? raw : $("input").value).trim();
  if (!text || loading) return;
  if (!KEY) { openSettings(); return; }
  $("input").value = ""; autosize(); error = "";
  let c = active();
  if (!c) { c = { id: uid(), title: text.slice(0, 40), messages: [] }; S.chats.unshift(c); S.activeId = c.id; }
  c.messages.push({ role: "user", content: text });
  save(); loading = true; renderAll(); $("send").disabled = true;
  try {
    let reply;
    if (PROVIDER === "gemini") {
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(MODEL) + ":generateContent", {
        method: "POST",
        headers: { "content-type": "application/json", "x-goog-api-key": KEY },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM }] },
          contents: c.messages.map((m) => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }))
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data.error && data.error.message) || "فشل الطلب");
      const parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
      reply = parts.map((p) => p.text || "").join("\n") || "(رد فاضي)";
    } else {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": KEY,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({ model: MODEL, max_tokens: 2000, system: SYSTEM, messages: c.messages })
      });
      const data = await res.json();
      if (!res.ok) throw new Error((data.error && data.error.message) || "فشل الطلب");
      reply = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n") || "(رد فاضي)";
    }
    c.messages.push({ role: "assistant", content: reply });
  } catch (e) {
    error = "تعذّر الحصول على رد: " + e.message;
  }
  loading = false; save(); renderAll(); $("send").disabled = !$("input").value.trim();
}

function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 150) + "px"; }

$("input").addEventListener("input", () => { autosize(); $("send").disabled = loading || !$("input").value.trim(); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android|iPhone/i.test(navigator.userAgent)) { e.preventDefault(); send(); } });
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("menu").onclick = () => $("drawer").classList.add("open");
$("scrim").onclick = closeDrawer;
$("new").onclick = () => { S.activeId = null; error = ""; save(); closeDrawer(); renderAll(); };
function fillSettings() {
  const p = $("provider").value;
  $("keylabel").textContent = p === "gemini" ? "مفتاح Google Gemini API" : "مفتاح Anthropic API";
  $("key").placeholder = p === "gemini" ? "AIza..." : "sk-ant-...";
  $("key").value = keyOf(p);
  $("model").value = modelOf(p);
  $("keyhelp").textContent = HELP[p];
}
function openSettings() { $("provider").value = PROVIDER; fillSettings(); $("dlg").showModal(); }
$("provider").onchange = fillSettings;
$("settings").onclick = openSettings;
$("cancel").onclick = () => $("dlg").close();
$("save").onclick = () => {
  const p = $("provider").value;
  localStorage.setItem("salahpt:provider", p);
  localStorage.setItem("salahpt:key:" + p, $("key").value.trim());
  localStorage.setItem("salahpt:model:" + p, $("model").value.trim() || DEFAULTS[p]);
  PROVIDER = p; KEY = keyOf(p); MODEL = modelOf(p);
  $("dlg").close();
};

renderAll();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
